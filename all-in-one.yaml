apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authgear-token-app1
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: authgear-token-app1.oursky.codes
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: authgear-demo-webapp
            port:
              name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authgear-token-app2
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: authgear-token-app2.oursky.codes
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: authgear-demo-webapp
            port:
              name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authgear-demo-webapp
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: authgear-demo-webapp.oursky.codes
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: authgear-demo-webapp
            port:
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: authgear-demo-webapp
spec:
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: authgear-demo-webapp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authgear-demo-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authgear-demo-webapp
  template:
    metadata:
      labels:
        app: authgear-demo-webapp
    spec:
      containers:
      - name: authgear-demo-webapp
        image: quay.io/theauthgear/authgear-demo-webapp:git-24c447e1afd8
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: http
        readinessProbe:
          httpGet:
            path: /
            port: http
        resources:
          requests:
            cpu: 100m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 32Mi
